<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReplayHub Scoreboard Auto-Scale</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: "Montserrat", sans-serif;
        }

        /* positioning */
        .score-left {
            position: absolute;
            top: 20px;
            left: 30px;
        }

        .score-right {
            position: absolute;
            top: 20px;
            right: 30px;
        }

        /* ===========================================
           ANGLED BOX WITH PERFECT BORDER + GLOW PULSE
           =========================================== */
        .team-box {
            position: relative;
            height: 65px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 22px;
            border-radius: 6px;
            overflow: visible;
        }

        /* background mask */
        .team-box::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, #f5b7c8, #ffecef);
            clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 100%, 0 100%);
            z-index: -2;
        }

        /* border mask + SOFT GLOW PULSE */
        .team-box::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid black;
            border-radius: 6px;
            clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 100%, 0 100%);
            z-index: -1;
            animation: border-pulse 2.4s ease-in-out infinite;
        }

        /* RIGHT SIDE */
        .team-box.right::before {
            background: linear-gradient(to left, #f5b7c8, #ffecef);
            clip-path: polygon(26px 0, 100% 0, 100% 100%, 0 100%);
        }

        .team-box.right::after {
            clip-path: polygon(26px 0, 100% 0, 100% 100%, 0 100%);
        }

        /* fixed width for name area */
        .name-wrapper {
            width: 300px;
            display: flex;
            align-items: center;
        }

        .name-wrapper.left {
            justify-content: flex-start;
        }

        .name-wrapper.right {
            justify-content: flex-end;
        }

        .team-name {
            font-weight: 700;
            color: black;
            white-space: nowrap;
            display: inline-block;
            transform-origin: left center;
        }

        .team-name.right {
            transform-origin: right center;
        }

        /* score pill */
        .score-pill {
            background: white;
            border: 2px solid black;
            border-radius: 999px;
            padding: 6px 22px;
            font-size: 22px;
            font-weight: 700;
            color: black;
            min-width: 40px;
            text-align: center;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }

        /* bump class for score change */
        .score-pill.bump {
            animation: score-bump 0.28s ease-out;
        }

        /* hidden element for measuring name sizes */
        #measure {
            position: absolute;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
            white-space: nowrap;
            font-weight: 700;
            font-family: "Montserrat", sans-serif;
            font-size: 22px;
        }

        /* ============ ANIMATIONS ============ */

        /* soft glow on border */
        @keyframes border-pulse {
            0% {
                box-shadow: 0 0 0 rgba(255, 140, 180, 0);
            }

            50% {
                box-shadow: 0 0 14px rgba(255, 140, 180, 0.8);
            }

            100% {
                box-shadow: 0 0 0 rgba(255, 140, 180, 0);
            }
        }

        /* score bump when value changes */
        @keyframes score-bump {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.25);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- hidden measuring element -->
    <div id="measure"></div>

    <!-- LEFT TEAM -->
    <div class="score-left">
        <div class="team-box">
            <div class="name-wrapper left">
                <div class="team-name" id="name-left" data-replayhub-field="leftName">Left Team</div>
            </div>
            <div class="score-pill" id="score-left" data-replayhub-field="leftScore">0</div>
        </div>
    </div>

    <!-- RIGHT TEAM -->
    <div class="score-right">
        <div class="team-box right">
            <div class="name-wrapper right">
                <div class="team-name right" id="name-right" data-replayhub-field="rightName">Right Team</div>
            </div>
            <div class="score-pill" id="score-right" data-replayhub-field="rightScore">0</div>
        </div>
    </div>

    <!-- ReplayHub live script -->
    <script src="/api/public/live-graphics/client.js" data-replayhub-code="of54rgd7rc8x8hcbzk04rju2"
        data-replayhub-slug="test"></script>

    <script>
        const measure = document.getElementById("measure");
        const leftNameEl = document.getElementById("name-left");
        const rightNameEl = document.getElementById("name-right");
        const leftScoreEl = document.getElementById("score-left");
        const rightScoreEl = document.getElementById("score-right");

        let lastLeftScore = leftScoreEl.textContent;
        let lastRightScore = rightScoreEl.textContent;

        function autoScaleNames() {
            const maxWidth = 300; // must match .name-wrapper width

            leftNameEl.style.transform = "scale(1)";
            rightNameEl.style.transform = "scale(1)";

            const names = [leftNameEl.textContent, rightNameEl.textContent];

            let largest = 0;
            measure.style.fontSize = "22px";

            for (const n of names) {
                measure.textContent = n;
                largest = Math.max(largest, measure.offsetWidth);
            }

            const scale = Math.min(1, maxWidth / largest);

            leftNameEl.style.transform = `scale(${scale})`;
            rightNameEl.style.transform = `scale(${scale})`;
        }

        function checkScoreBump() {
            const currentLeft = leftScoreEl.textContent;
            const currentRight = rightScoreEl.textContent;

            if (currentLeft !== lastLeftScore) {
                leftScoreEl.classList.remove("bump");
                void leftScoreEl.offsetWidth; // force reflow to restart animation
                leftScoreEl.classList.add("bump");
                lastLeftScore = currentLeft;
            }

            if (currentRight !== lastRightScore) {
                rightScoreEl.classList.remove("bump");
                void rightScoreEl.offsetWidth;
                rightScoreEl.classList.add("bump");
                lastRightScore = currentRight;
            }
        }

        // run both regularly – ReplayHub updates fields, we react
        setInterval(() => {
            autoScaleNames();
            checkScoreBump();
        }, 300);
    </script>

</body>

</html>
