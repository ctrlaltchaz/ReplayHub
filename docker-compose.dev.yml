version: '3.8'

services:
  # Development overrides for the backend
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
      target: development
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
    command: npm run dev --workspace=@esports-ops/api
    environment:
      - NODE_ENV=development

  # Development overrides for the frontend  
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
      target: development
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/apps/web/.next
    command: npm run dev --workspace=@esports-ops/web
    environment:
      - NODE_ENV=development